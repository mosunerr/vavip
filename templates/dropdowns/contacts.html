<section class="dropdown-section contacts-section" data-key="0" role="region" aria-labelledby="menu-contacts">
  <div class="contacts-combined" role="group" aria-label="КОНТАКТЫ">
    <div class="contacts-overlay" aria-hidden="true"></div>

<!-- ПЕРЕНЕСЁННЫЙ overlay формы: теперь дочерний .contacts-combined -->
<div id="feedback-form" class="feedback-panel" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:100; pointer-events:auto; overflow:auto;">
  <form method="POST" action="{{ url_for('feedback') }}" class="feedback-form"
        style="background:#282727; border-radius:0; box-shadow:0 8px 24px rgba(0,0,0,.15);
               width:100%; max-width:none; margin:0; padding:0; box-sizing:border-box;">
    <!-- Крестик закрытия (белый, в правом верхнем углу) -->
    <button type="button" class="form-close" aria-label="Закрыть форму"
            style="position:absolute; top:20px; right:20px; width:32px; height:32px;
                   display:flex; align-items:center; justify-content:center;
                   background:transparent; border:none; color:#ffffff; font-size:24px; line-height:1; cursor:pointer; z-index:1;">
      ×
    </button>

    <!-- Центрируем поля внутри темного фона (исходные размеры: max-width 900px, margin auto) -->
    <div class="form-inner"
         style="max-width:900px; margin:28px auto; padding:32px 48px; box-sizing:border-box;
                display:grid; grid-template-columns:repeat(12,1fr); gap:24px;">
      <!-- Первая строка: Тема / Email -->
      <label for="topic" style="grid-column:1/7; font-weight:600; color:#ffffff;">Тема</label>
      <label for="email" style="grid-column:7/13; font-weight:600; color:#ffffff;">Email</label>

      <select id="topic" name="topic" required
              style="grid-column:1/7; padding:18px 22px; border:1px solid #dedede; border-radius:10px; background:#474343; font-size:16px; color:#ffffff;">
        <option value="quality_products" selected>Качество продуктов, услуг и доставки</option>
        <option value="support">Техническая поддержка</option>
        <option value="other">Другое</option>
      </select>
      <input id="email" name="email" type="email" required
             style="grid-column:7/13; padding:18px 22px; border:1px solid #dedede; border-radius:10px; background:#474343; font-size:16px; color:#ffffff;">

      <!-- Вторая строка: Имя* / Телефон* -->
      <label for="name" style="grid-column:1/7; font-weight:600; color:#ffffff; display:flex; align-items:center; gap:6px;">
        Имя <span aria-hidden="true" style="color:#e56b2f;">*</span>
      </label>
      <label for="phone" style="grid-column:7/13; font-weight:600; color:#ffffff; display:flex; align-items:center; gap:6px;">
        Телефон <span aria-hidden="true" style="color:#e56b2f;">*</span>
      </label>

      <input id="name" name="name" type="text" required
             style="grid-column:1/7; padding:18px 22px; border:1px solid #dedede; border-radius:10px; background:#474343; font-size:16px; color:#ffffff;">
      <input id="phone" name="phone" type="tel" required placeholder="+7 (___) ___-__-__"
             style="grid-column:7/13; padding:18px 22px; border:1px solid #dedede; border-radius:10px; background:#474343; font-size:16px; color:#ffffff;">

      <!-- Третья строка: Комментарий -->
      <label for="message" style="grid-column:1/13; font-weight:600; color:#ffffff;">Комментарий</label>
      <textarea id="message" name="message" required rows="2"
                style="grid-column:1/13; padding:18px 22px; border:1px solid #dedede; border-radius:10px; background:#474343; font-size:16px; resize:vertical; color:#ffffff;"></textarea>

      <!-- Кнопка отправки по центру -->
      <div style="grid-column:1/13; display:flex; justify-content:center; margin-top:8px;">
        <button type="submit"
                style="padding:14px 28px; border:2px solid #f0c7ad; background:#282727; color:#ffffff; font-weight:600; border-radius:28px; cursor:pointer;">
          ОТПРАВИТЬ
        </button>
      </div>
    </div>
  </form>
</div>


    <div class="contacts-left">
      <div class="contacts-mini-header" hidden>
        <button class="mini-nav-item" data-section="uzel">УЗЕЛ ВВОДА</button>
        <button class="mini-nav-item" data-section="project">ПРОЕКТИРОВАНИЕ</button>
        <button class="mini-nav-item" data-section="montage">МОНТАЖ</button>
        <button class="mini-nav-item" data-section="shop">МАГАЗИН</button>
      </div>

      <div class="contacts-tiles hero-grid" role="group" aria-label="Разделы контактов">
        <button type="button" class="tile hero-tile" data-tile="uzel" style="--tile-img-1: url('{{ url_for('static', filename='images/contacts/words/word-1.jpg') }}');">
          <div class="layer-1"></div>
          <div class="layer-2"></div>
          <span class="tile-title hero-title">УЗЕЛ ВВОДА</span>
        </button>
        <button type="button" class="tile hero-tile" data-tile="project" style="--tile-img-1: url('{{ url_for('static', filename='images/contacts/words/word-2.jpg') }}');">
          <div class="layer-1"></div>
          <div class="layer-2"></div>
          <span class="tile-title hero-title">ПРОЕКТИРОВАНИЕ</span>
        </button>
        <button type="button" class="tile hero-tile" data-tile="montage" style="--tile-img-1: url('{{ url_for('static', filename='images/contacts/words/word-3.jpg') }}');">
          <div class="layer-1"></div>
          <div class="layer-2"></div>
          <span class="tile-title hero-title">МОНТАЖ</span>
        </button>
        <button type="button" class="tile hero-tile" data-tile="shop" style="--tile-img-1: url('{{ url_for('static', filename='images/contacts/words/word-4.jpg') }}');">
          <div class="layer-1"></div>
          <div class="layer-2"></div>
          <span class="tile-title hero-title">МАГАЗИН</span>
        </button>
      </div>

      <div class="contacts-location" hidden>
        <div class="location-inner" role="group" aria-label="Выбор местоположения">
          <nav class="location-mini-header" aria-label="Разделы">
            <button class="mini-link" data-section="uzel" type="button">УЗЕЛ ВВОДА</button>
            <button class="mini-link" data-section="project" type="button">ПРОЕКТИРОВАНИЕ</button>
            <button class="mini-link" data-section="montage" type="button">МОНТАЖ</button>
            <button class="mini-link" data-section="shop" type="button">МАГАЗИН</button>
          </nav>
          <div class="location-gap"></div>
          <span class="location-title">ВЫБЕРИТЕ МЕСТОПОЛОЖЕНИЕ</span>
          <button class="back-to-countries" type="button" hidden aria-label="Назад к странам">
            <span class="back-arrow">
              <svg viewBox="0 0 22 22">
                <polyline points="14,4 6,11 14,18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="back-text">НАЗАД</span>
          </button>
          <ul class="countries-list" role="list">
            <li><button class="country-link" data-country="ru" type="button">РОССИЯ</button></li>
            <li><button class="country-link" data-country="by" type="button">БЕЛАРУСЬ</button></li>
            <li><button class="country-link" data-country="kz" type="button">КАЗАХСТАН</button></li>
            <li><button class="country-link" data-country="ge" type="button">ГРУЗИЯ</button></li>
            <li><button class="country-link" data-country="ae" type="button">ОАЭ</button></li>
          </ul>
        </div>
      </div>

      <div class="contacts-city-info" id="contacts-city-info" hidden>
        <img id="city-photo" src="" alt="">
        <div id="city-contacts"></div>
      </div>
    </div>

    <div class="contacts-right-col" id="contacts-right">
      <div class="contacts-info-area" id="contacts-info">
        <div id="contacts-basics" class="contacts-center-group">
          <p class="contacts-phone">
            <a id="contacts-phone-link" href="tel:+79312487013">+7 (931) 248-70-13</a>
          </p>
          <p class="contacts-hours" id="contacts-hours-text">ПН-ПТ 09:00–19:00</p>
          <div class="contacts-actions-row">
            <button id="feedback-open-btn" type="button" class="btn btn-chip">ОБРАТНАЯ СВЯЗЬ</button>
            <div class="contacts-icons-row">
              <a class="social-icon telegram" href="https://t.me/karen_vavip" target="_blank" rel="noopener noreferrer">
                <img src="{{ url_for('static', filename='images/icons/telegram.svg') }}" alt="Telegram">
              </a>
              <a class="social-icon whatsapp" href="https://wa.me/79312487013" target="_blank" rel="noopener noreferrer">
                <img src="{{ url_for('static', filename='images/icons/whatsapp1.svg') }}" alt="WhatsApp">
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
